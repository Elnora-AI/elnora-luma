# Dependabot bumps package.json/package-lock.json but cannot rebuild the
# committed dist/ bundle, so every npm bump (commander, esbuild, …) would fail
# the CI "Bundle freshness" gate. This workflow rebuilds dist/ on Dependabot
# PRs and pushes the result back to the PR branch.
#
# SECURITY: `pull_request_target` runs with base-repo secrets. This is safe
# ONLY because (a) the job is hard-gated to actor == dependabot[bot], and
# (b) `npm ci --ignore-scripts` blocks dependency lifecycle scripts. Do NOT
# widen the actor gate or remove --ignore-scripts.
name: Dependabot — rebuild dist

on:
  pull_request_target:
    types: [opened, synchronize]

permissions:
  contents: read

jobs:
  rebuild:
    name: Rebuild committed bundle
    if: ${{ github.actor == 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          # RELEASE_BOT_PAT so the push retriggers CI (GITHUB_TOKEN pushes don't).
          token: ${{ secrets.RELEASE_BOT_PAT }}
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Push refreshed dist/ if it changed
        run: |
          if [ -z "$(git status --porcelain -- dist)" ]; then
            echo "dist/ already fresh — nothing to push"
            exit 0
          fi
          git config user.name "elnora-release-bot"
          git config user.email "opensource@elnora.ai"
          git add -A dist
          git commit -m "chore: rebuild dist for dependency bump"
          git push
