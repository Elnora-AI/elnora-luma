# CodeQL Security Scanning
#
# SAST for this TypeScript codebase using GitHub's CodeQL engine.
# Evidence: Security tab > Code scanning alerts

name: CodeQL Security Analysis

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly on Sundays at 3:00 AM UTC
    - cron: '0 3 * * 0'
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze TypeScript
    # CodeQL needs GitHub Advanced Security on private repos, so gate on visibility.
    # `github.event.repository` is absent on `schedule` events, so the weekly cron
    # skips while this gate exists — DELETE the whole `if:` once the repo is public.
    if: ${{ github.event.repository.visibility == 'public' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-extended
          # dist/main.js is the committed esbuild bundle of src/ (see .gitignore).
          # Scanning it duplicates every src/ alert against unreviewable generated
          # code; CI already fails if dist drifts from a clean rebuild of src.
          config: |
            paths-ignore:
              - dist
      - uses: github/codeql-action/autobuild@v4
      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript-typescript"
